<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
     <link rel="stylesheet" th:href="@{/css/stile.css}" />
  <link rel="icon" type="image/jpeg" th:href="@{/css/cross.jpg}">

</head>
<body>
    <header>
        <h1>Benvenuto! Loggati o Chiedi di essere registrato</h1>
        <p><a th:href="@{/}" class="header-link">Annulla</a></p>
    </header>

    <div class="nav-container">
        <form th:action="@{/login}" method="POST" class="form-box">



            <div class="form-group">
                <label class="form-label">Username:</label>
                <input type="text" name="username" required />
            </div>

            <div class="form-group">
                <label class="form-label">Password:</label>
                <input type="password" name="password" required />


            </div>

            <button type="submit" class="nav-button">Login</button>
        </form>
        <a th:href="@{/richiesta-registrazione}" class="nav-button">
            <span>Manda richiesta per registrarti</span>
        </a>
    </div>
    

</body>
</html>
