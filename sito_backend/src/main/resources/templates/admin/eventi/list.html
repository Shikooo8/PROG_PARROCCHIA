<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Eventi - Amministrazione</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}">
    <link rel="icon" type="image/png" th:href="@{/images/cross.png}">

</head>

<body>

    <header th:replace="~{fragments/riquadroAltissimo :: riquadroAltissimo}"></header>

    <main>

        <section class="fascia-titolo">
            <div class="fascia-titolo-contenuto">

                <h1>Gestione eventi</h1>

                <a th:href="@{/admin/eventi/nuovo}" class="btn btn-primario">
                    Crea nuovo
                </a>

            </div>
        </section>

        <section class="sezione">
            <div class="container">

                <div class="tabella-riquadro">

                    <table class="tabella">

                        <thead>
                            <tr>
                                <th>Titolo</th>
                                <th>Data</th>
                                <th>Azioni</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="evento : ${eventi}">

                                <td th:text="${evento.titolo}">
                                    Titolo
                                </td>

                                <td th:text="${evento.data}">
                                    Data
                                </td>


                                <td>

                                    <a th:href="@{/admin/eventi/{id}/modifica(id=${evento.id})}"
                                        class="btn btn-piccolo btn-secondario">
                                        Modifica
                                    </a>

                                    <form th:action="@{/admin/eventi/{id}/cancella(id=${evento.id})}" method="POST"
                                        style="display:inline;"
                                        onsubmit="return confirm('Sei sicuro di voler eliminare questo evento?');">

                                        <button type="submit" class="btn btn-piccolo btn-pericolo">
                                            Cancella
                                        </button>

                                    </form>


                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(eventi)}">
                                <td colspan="4" class="tabella-vuota">
                                    Nessun evento presente.
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>
        </section>

    </main>

</body>

</html>
