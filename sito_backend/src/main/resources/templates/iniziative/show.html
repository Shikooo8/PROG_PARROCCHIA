<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${iniziativa.titolo} + ' - Parrocchia Trasfigurazione'">
        Iniziativa - Parrocchia Trasfigurazione
    </title>

    <link rel="stylesheet" th:href="@{/css/stile.css}">
    <link rel="icon" type="image/png" th:href="@{/images/cross.png}">


</head>

<body>

    <!-- HEADER -->

    <div th:replace="~{fragments/riquadroAltissimo :: riquadroAltissimo}"></div>


    <!-- TITOLO PAGINA -->

    <section class="fascia-titolo">

        <div class="fascia-titolo-contenuto">

            <div>

                <h1>
                    Iniziativa
                </h1>

                <p class="breadcrumb">

                    <a th:href="@{/}">
                        Home
                    </a>

                    /

                    <a th:href="@{/iniziative}">
                        Iniziative
                    </a>

                    /

                    <span th:text="${iniziativa.titolo}">
                        Iniziativa
                    </span>

                </p>

            </div>

        </div>

    </section>


    <!-- DETTAGLIO -->

    <section class="sezione">

        <div class="container">

            <div class="dettaglio">

                <!-- Torna alla lista -->

                <a class="dettaglio-torna" th:href="@{/iniziative}">
                    ← Torna alle iniziative
                </a>


                <!-- Immagine -->

                <div class="scheda-immagine-segnaposto">
                    ✝
                </div>


                <!-- Titolo -->

                <h2 class="dettaglio-titolo" th:text="${iniziativa.titolo}">Titolo dell'iniziativa</h2>

                <!-- Descrizione -->

                <div class="dettaglio-testo" th:text="${iniziativa.descrizione}">Descrizione dell'iniziativa.</div>


                <!--
                Questa parte è intenzionalmente lasciata
                fuori dalla visualizzazione pubblica.

                Gli iscritti e il coordinatore saranno
                gestiti in una successiva area riservata
                ad admin e coordinatore.
            -->
                

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <div class="footer-griglia">

                <div>

                    <h3 class="footer-titolo">
                        Parrocchia Trasfigurazione
                    </h3>

                    <p class="footer-testo">
                        La nostra comunità parrocchiale.
                    </p>

                </div>


                <div>

                    <h3 class="footer-titolo">
                        Navigazione
                    </h3>

                    <ul class="footer-links">

                        <li>
                            <a th:href="@{/}">
                                Home
                            </a>
                        </li>

                        <li>
                            <a th:href="@{/notizie}">
                                Notizie
                            </a>
                        </li>

                        <li>
                            <a th:href="@{/eventi}">
                                Eventi
                            </a>
                        </li>

                        <li>
                            <a th:href="@{/iniziative}">
                                Iniziative
                            </a>
                        </li>

                    </ul>

                </div>

            </div>


            <div class="footer-copy">

                © Parrocchia Trasfigurazione

            </div>

        </div>

    </footer>

</body>

</html>
