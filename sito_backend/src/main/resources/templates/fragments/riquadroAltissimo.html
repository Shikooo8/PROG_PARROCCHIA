<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org">

<body>

<header class="header-top" th:fragment="riquadroAltissimo">

    <nav class="navbar">

        <!-- Nome della parrocchia -->
        <a class="navbar-logo" th:href="@{/}">
            Parrocchia della Trasfigurazione di N.S.G.C
            <span>Comunità parrocchiale</span>
        </a>

        <!-- Navigazione -->
        <div class="navbar-links">

            <a th:href="@{/}"
               th:classappend="${pagina == 'home'} ? ' attivo' : ''">
                Home
            </a>

            <a th:href="@{/notizie}"
               th:classappend="${pagina == 'notizie'} ? ' attivo' : ''">
                Notizie
            </a>

            <a th:href="@{/eventi}"
               th:classappend="${pagina == 'eventi'} ? ' attivo' : ''">
                Eventi
            </a>

            <a th:href="@{/iniziative}"
               th:classappend="${pagina == 'iniziative'} ? ' attivo' : ''">
                Iniziative
            </a>

            <!-- Utente non autenticato -->
            <a class="navbar-cta"
               th:if="${utenteLoggato == null or !utenteLoggato}"
               th:href="@{/login}">
                Login
            </a>

            <!-- Utente autenticato -->
            <span class="navbar-utente"
                  th:if="${utenteLoggato != null and utenteLoggato}">
                <span th:text="${nomeUtente}">Utente</span>
            </span>

            <a class="navbar-cta"
               th:if="${utenteLoggato != null and utenteLoggato}"
               th:href="@{/logout}">
                Logout
            </a>

            <!-- Area amministrazione -->
            <div class="navbar-dropdown"
                 th:if="${admin != null and admin}">

                <a href="#">
                    Amministrazione
                </a>

                <div class="navbar-dropdown-content">

                    <a th:href="@{/admin/richieste}">
                        Richieste registrazione
                    </a>

                    <a th:href="@{/admin/utenti}">
                        Utenti
                    </a>

                    <a th:href="@{/admin/eventi}">
                        Eventi
                    </a>

                    <a th:href="@{/admin/iniziative}">
                        Iniziative
                    </a>

                    <a th:href="@{/admin/notizie}">
                        Notizie
                    </a>

                </div>
            </div>

        </div>

    </nav>

</header>

</body>
</html>
