<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<header class="header-top" th:fragment="riquadroAltissimo">

    <nav class="navbar">

        <!-- Nome della parrocchia: porta alla Home -->
        <a class="navbar-logo" th:href="@{/}">
            Trasfigurazione di N.S.G.C
        </a>

        <!-- Navigazione -->
        <div class="navbar-links">

            <a th:href="@{/notizie}"
               th:classappend="${pagina == 'notizie'} ? ' attivo' : ''">
                Notizie
            </a>

            <a th:href="@{/eventi}"
               th:classappend="${pagina == 'eventi'} ? ' attivo' : ''">
                Eventi
            </a>

            <a th:href="@{/iniziative}"
               th:classappend="${pagina == 'iniziative'} ? ' attivo' : ''">
                Iniziative
            </a>

            <!-- Utente non autenticato -->
            <a class="navbar-cta"
               sec:authorize="!isAuthenticated()"
               th:href="@{/login}">
                Login
            </a>

            <!-- Utente autenticato -->
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="POST">

                <button class="navbar-button" type="submit">
                    Logout
                </button>

            </form>

            <!-- Area amministrazione -->
            <a class="navbar-cta"
               sec:authorize="hasAuthority('ADMIN')"
               th:href="@{/admin/index}">
                Amministrazione
            </a>

        </div>

    </nav>

</header>

</body>
</html>
