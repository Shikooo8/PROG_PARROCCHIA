
server.port=8082
server.address=127.0.0.1
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL_PARROCCHIA_PROD}
spring.datasource.username=${DB_USERNAME_PARROCCHIA_PROD}
spring.datasource.password=${DB_PASSWORD_PARROCCHIA_PROD}

#^^^^^^^^^^^^^^^^^  spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=false
#logging.level.org.hibernate.SQL=warn
#logging.level.org.hibernate.type.descriptor.sql=warn
server.servlet.session.cookie.secure=true

spring.config.import=optional:file:.env[.properties]




spring.application.name=sito
#==================================
# = Datasource
#==================================
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


#==================================
# = Thymeleaf configurations
#==================================
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false
#spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
#==================================
# = Mesasage configurations
#==================================
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
#==================================
# = Images configurations
#==================================
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
